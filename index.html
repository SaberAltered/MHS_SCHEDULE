<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunter's Special Schedule — Elation Edition</title>
    <link rel="icon" type="image/png" href="art/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           SECTION 1: AHA / ELATION THEME & COLORS
        ========================================= */
        :root {
            --bg-color: #04030c;
            --card-bg: rgba(14, 10, 32, 0.03);
            --card-border: rgba(196, 181, 253, 0.22);
            --text-main: #f8fafc;
            --text-dim: #c4b5fd;
            --accent-a: #fbbf24;
            --accent-b: #c084fc;
            --highlight: #fde047;
            --robotics: #f43f5e;
            --font-choice: 'Inter', sans-serif;
            --bg-image: none;
        }

        /* =========================================
           SECTION 2: CORE LAYOUT & AHA OVERWATCH
        ========================================= */
        body {
            font-family: var(--font-choice);
            background-color: var(--bg-color);
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        /* Custom URL overlay when user sets a custom background */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(4, 3, 12, 0.55);
            z-index: -1;
            display: var(--overlay-display, none);
        }

        /* Aha Overwatch Backdrop Layer */
        .aha-overwatch {
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            overflow: hidden;
            background: radial-gradient(circle at 50% 25%, #19133a 0%, #04030c 75%);
        }

        .aha-overwatch img {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            margin-left: 0;
            object-fit: cover;
            object-position: center 15%;
            opacity: 0.95;
            filter: saturate(1.08) contrast(1.04);
            animation: ahaFloat 10s ease-in-out infinite alternate;
        }

        @media (min-width: 601px) {
            .aha-overwatch.theme-b::before {
                content: "";
                position: absolute;
                inset: 0;
                z-index: 0;
                background-image: url("art/BlackSwan.webp");
                background-size: cover;
                background-position: left 15%;
                opacity: 0.95;
                filter: saturate(1.08) contrast(1.04);
                -webkit-mask-image: linear-gradient(to right, black 0%, black 24%, transparent 45%);
                mask-image: linear-gradient(to right, black 0%, black 24%, transparent 45%);
            }

            .aha-overwatch.theme-b img {
                margin-left: 22vw;
                -webkit-mask-image: linear-gradient(to right, transparent 2%, black 24%, black 100%);
                mask-image: linear-gradient(to right, transparent 2%, black 24%, black 100%);
            }
        }

        /* Seamless cosmic vignette so cards stay crisp and readable */
        .aha-overwatch::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 2;
            background:
                linear-gradient(
                    to bottom,
                    rgba(4, 3, 12, 0.12) 0%,
                    rgba(4, 3, 12, 0.08) 32%,
                    rgba(4, 3, 12, 0.68) 62%,
                    rgba(4, 3, 12, 0.95) 100%
                ),
                radial-gradient(circle at 50% 35%, transparent 35%, rgba(4, 3, 12, 0.72) 100%);
        }

        /* Subtle twinkling starlight particles */
        .aha-stars {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-image:
                radial-gradient(1.5px 1.5px at 18% 22%, rgba(255, 255, 255, 0.7), transparent),
                radial-gradient(1.5px 1.5px at 82% 18%, rgba(253, 224, 71, 0.65), transparent),
                radial-gradient(1px 1px at 30% 45%, rgba(196, 181, 253, 0.7), transparent),
                radial-gradient(1.5px 1.5px at 72% 40%, rgba(255, 255, 255, 0.6), transparent),
                radial-gradient(1px 1px at 50% 12%, rgba(253, 224, 71, 0.8), transparent);
            animation: twinkle 4.5s ease-in-out infinite alternate;
        }

        @keyframes ahaFloat {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-5px); }
        }

        @keyframes twinkle {
            0% { opacity: 0.45; }
            100% { opacity: 0.95; }
        }

        .aha-star {
            cursor: pointer;
            display: inline-block;
            transition: transform 0.2s ease, text-shadow 0.2s ease;
        }
        .aha-star:hover {
            color: var(--highlight);
            transform: scale(1.25) rotate(15deg);
            text-shadow: 0 0 12px rgba(253, 224, 71, 0.9);
        }
        #confetti-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 999;
        }

        /* Header positioned right below Aha's pointing hand */
        .header {
            width: 100%;
            max-width: 360px;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 14px;
            z-index: 1;
            padding: 14px 28px;
            border-radius: 20px;
            background: rgba(10, 7, 24, 0.62);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(253, 224, 71, 0.25);
            box-shadow: 0 0 28px rgba(168, 85, 247, 0.22);
        }

        .header h1 {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin: 0;
            font-weight: 500;
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        #day-display {
            font-size: clamp(1.85rem, 7vw, 3rem);
            font-weight: 900;
            margin: 4px 0 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .is-a #day-display {
            color: var(--accent-a);
            text-shadow: 0 0 22px rgba(251, 191, 36, 0.55);
        }

        body.is-b {
            --bg-color: #070414;
            --card-border: rgba(192, 132, 252, 0.30);
            --text-dim: #d8b4fe;
            --highlight: #38bdf8;
        }
        body.is-b .header {
            border-color: rgba(192, 132, 252, 0.35);
            box-shadow: 0 0 28px rgba(56, 189, 248, 0.20);
        }
        body.is-b .current-row {
            background: linear-gradient(90deg, rgba(192, 132, 252, 0.18), rgba(56, 189, 248, 0.08));
        }
        #theme-subtitle {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 2px;
            opacity: 0.92;
        }
        .is-a #theme-subtitle { color: var(--accent-a); }
        .is-b #theme-subtitle { color: var(--accent-b); }

        .test-badge {
            display: none;
            margin-top: 4px;
            font-size: 0.65rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--highlight);
            opacity: 0.85;
        }
        .test-btn-row {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .test-btn-row .menu-btn {
            flex: 1;
            background: rgba(192, 132, 252, 0.16);
            color: var(--text-main);
            border: 1px solid rgba(192, 132, 252, 0.3);
        }
        .test-btn-row .menu-btn.active-test {
            background: var(--highlight);
            color: #04030c;
            border-color: var(--highlight);
        }

        .is-b #day-display {
            color: var(--accent-b);
            text-shadow: 0 0 22px rgba(192, 132, 252, 0.55);
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-grow: 1;
            z-index: 1;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: none;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.78), 0 0 18px rgba(168, 85, 247, 0.12);
            border: 1px solid var(--card-border);
        }

        /* =========================================
           SECTION 3: TABLES & EVENT LISTS
        ========================================= */
        table { width: 100%; border-collapse: collapse; }
        th {
            background: rgba(6, 4, 18, 0.6);
            padding: 12px 15px;
            text-align: left;
            color: var(--text-dim);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }
        td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(196, 181, 253, 0.08);
            vertical-align: middle;
        }
        tr:last-child td { border-bottom: none; }

        .time-col {
            color: var(--text-dim);
            width: 45%;
            font-size: 0.8rem;
            font-weight: 500;
            white-space: nowrap;
        }

        .current-row {
            background: linear-gradient(90deg, rgba(253, 224, 71, 0.16), rgba(192, 132, 252, 0.08));
            border-left: 4px solid var(--highlight);
        }

        .event-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(196, 181, 253, 0.08);
        }
        .event-item:last-child { border-bottom: none; }
        .event-info { display: flex; flex-direction: column; }
        .event-time { font-size: 0.75rem; color: var(--highlight); font-weight: 700; }
        .delete-btn {
            background: none;
            border: none;
            color: #fb7185;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 5px;
        }

        /* =========================================
           SECTION 4: PORTAL BUTTONS & FOOTER
        ========================================= */
        .portal-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            margin-top: 5px;
            z-index: 1;
        }

        .portal-btn {
            display: block;
            width: 100%;
            max-width: 260px;
            text-align: center;
            padding: 11px 20px;
            background: rgba(20, 14, 48, 0.85);
            color: var(--text-main);
            text-decoration: none;
            border-radius: 10px;
            border: 1px solid rgba(196, 181, 253, 0.35);
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            box-sizing: border-box;
        }

        .portal-btn:hover {
            border-color: var(--highlight);
            box-shadow: 0 6px 18px rgba(253, 224, 71, 0.2);
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            padding-bottom: 20px;
            z-index: 1;
        }
        #clock-display {
            font-size: 2.2rem;
            font-weight: 700;
            text-shadow: 0 0 14px rgba(196, 181, 253, 0.35);
        }
        #date-display {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        #edit-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(20, 14, 48, 0.9);
            color: var(--text-main);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid rgba(196, 181, 253, 0.45);
            z-index: 100;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.8);
            font-size: 1.05rem;
        }
        #edit-btn:hover { border-color: var(--highlight); }

        #settings-menu {
            position: fixed;
            bottom: 75px;
            left: 20px;
            background: rgba(16, 12, 38, 0.95);
            backdrop-filter: none;
            padding: 18px;
            border-radius: 12px;
            display: none;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(196, 181, 253, 0.25);
            z-index: 101;
            width: 265px;
            max-height: 70vh;
            overflow-y: auto;
        }
        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }
        input, select {
            padding: 8px;
            border-radius: 6px;
            background: #060412;
            color: white;
            border: 1px solid rgba(192, 132, 252, 0.4);
            font-size: 0.75rem;
            outline: none;
        }
        input:focus { border-color: var(--highlight); }

        .menu-btn {
            cursor: pointer;
            border: none;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            body {
                padding-top: clamp(160px, 26vh, 220px);
            }
            .aha-overwatch img {
                width: 100%;
                height: 100%;
                margin-left: 0;
                object-position: center top;
            }
        }
    </style>
</head>
<body id="body-tag">

    <!-- Aha Overwatch Backdrop -->
    <div class="aha-overwatch" id="aha-backdrop">
        <img id="overwatch-img" src="art/Aha.webp" fetchpriority="high" alt="Character watching over Hunter's schedule">
    </div>
    <div class="aha-stars" id="aha-stars"></div>

    <!-- =========================================
         SECTION 5: HTML STRUCTURE
    ========================================= -->
    <div class="header">
        <h1><span class="aha-star" title="Aha Instant">★</span> Hunter's Schedule <span class="aha-star" title="Aha Instant">★</span></h1>
        <div id="day-display">Loading...</div>
        <div id="theme-subtitle"></div>
        <div id="test-badge" class="test-badge">Test Mode Active</div>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <div class="container">
        <!-- Robotics Alert -->
        <div id="robotics-alert" class="card" style="display:none; padding:15px; border:1px solid var(--robotics); background:rgba(244, 63, 94, 0.14);">
            <h3 style="margin:0; color:var(--robotics); font-size:0.9rem;">🎭 Robotics Today</h3>
            <p id="robotics-time" style="margin: 5px 0 0 0; font-size: 0.8rem;"></p>
        </div>

        <!-- Evening Events List -->
        <div class="card" id="events-card" style="display:none;">
            <div style="background: rgba(6, 4, 18, 0.5); padding: 10px 15px; font-size: 0.7rem; text-transform: uppercase; color: var(--text-dim); letter-spacing: 1px;">Tonight's Tasks</div>
            <div id="events-list"></div>
        </div>

        <!-- Main Schedule Table -->
        <div class="card">
            <table>
                <thead><tr><th>Time</th><th>Class</th></tr></thead>
                <tbody id="schedule-body"></tbody>
            </table>
        </div>

        <!-- BUTTONS: SOCIAL BOARD & PROJECTS -->
        <div class="portal-stack">
            <a href="https://saber-inc.org/social.html" target="_blank" rel="noopener" class="portal-btn">
                📡 Open Social Board
            </a>
            <a href="https://saber-inc.org/projects.html" target="_blank" rel="noopener" class="portal-btn">
                🚀 Projects &amp; Code
            </a>
        </div>
    </div>

    <div class="footer">
        <div id="clock-display"></div>
        <div id="date-display"></div>
    </div>

    <!-- Settings & Quick Add -->
    <button id="edit-btn" title="Edit Schedule/Theme">✎</button>
    <div id="settings-menu">
        <div class="setting-item">
            <label style="font-weight: bold; color: var(--highlight);">+ Quick Add Event (Local)</label>
            <input type="text" id="event-name" placeholder="What are you doing?">
            <div style="display:flex; gap:5px;">
                <input type="text" id="event-time-val" placeholder="Time (ex: 7 PM)" style="flex-grow:1;">
                <button id="add-event-btn" class="menu-btn" style="background:var(--highlight); color:#000;">Add</button>
            </div>
        </div>
        <div class="setting-item">
            <label style="color: var(--text-dim);">Custom Background Image URL</label>
            <input type="text" id="img-url" placeholder="Paste link here...">
            <button id="reset-aha-btn" class="menu-btn" style="background: rgba(192, 132, 252, 0.2); color: var(--text-dim); border: 1px solid rgba(192, 132, 252, 0.35);">Reset to Character Theme</button>
        </div>
        <div class="setting-item">
            <label style="color: var(--text-dim);">🔒 Test Mode</label>
            <div id="test-lock-row" style="display:flex; gap:5px;">
                <input type="password" id="test-pin-input" placeholder="Enter PIN..." style="flex-grow:1;">
                <button id="unlock-test-btn" class="menu-btn" style="background: rgba(192, 132, 252, 0.25); color: white;">Unlock</button>
            </div>
            <div id="test-controls" style="display:none; flex-direction:column; gap:6px;">
                <div class="test-btn-row">
                    <button id="test-auto-btn" class="menu-btn active-test">Auto</button>
                    <button id="test-a-btn" class="menu-btn">Aha Day</button>
                    <button id="test-b-btn" class="menu-btn">Black Swan</button>
                </div>
                <button id="lock-test-btn" class="menu-btn" style="background: rgba(244, 63, 94, 0.2); color: #fda4af;">Lock Test Mode</button>
            </div>
        </div>
        <button id="close-settings-btn" class="menu-btn" style="margin-top:2px; background: #3b0764; color: white;">Close Settings</button>
    </div>

<script>
    /* =========================================
       SECTION 6: SCHEDULE CONFIGURATION
    ========================================= */
    const schoolSchedule = {
        "A": [
            { name: "Community Release", start: "08:30", end: "09:55", note: "First block" },
            { name: "PSP", start: "10:10", end: "11:35" },
            { name: "Economics", start: "11:50", end: "13:15" },
            { name: "Lunch", start: "13:15", end: "13:45" },
            { name: "School Store at the CA", start: "14:00", end: "15:25", note: "Last Block Of The Day" }
        ],
        "B": [
            { name: "Aviation", start: "08:30", end: "09:55" },
            { name: "Off Block", start: "10:10", end: "11:35" },
            { name: "English", start: "11:50", end: "13:15" },
            { name: "Lunch", start: "13:15", end: "13:45" },
            { name: "School Store", start: "14:00", end: "15:25", note: "Last Block Of The Day" }
        ]
    };

    const startDate = new Date("2026-08-31T00:00:00");
    const startType = "A";

    const holidays = [
        "2026-09-04", "2026-09-07", "2026-09-25",
        "2026-10-15", "2026-10-16", "2026-11-09",
        "2026-11-25", "2026-11-26", "2026-11-27",
        "2026-12-23", "2026-12-24", "2026-12-25", "2026-12-28", "2026-12-29", "2026-12-30", "2026-12-31",
        "2027-01-01", "2027-01-18", "2027-02-15",
        "2027-03-08", "2027-03-09", "2027-03-26", "2027-03-29", "2027-04-23"
    ];

    /* =========================================
       SECTION 7: DATA & EVENT LOGIC
    ========================================= */
    let personalEvents = [];
    try {
        personalEvents = JSON.parse(localStorage.getItem('hunter-events')) || [];
    } catch (e) {
        personalEvents = [];
    }

    function saveEvents() {
        try {
            localStorage.setItem('hunter-events', JSON.stringify(personalEvents));
        } catch (e) {}
    }

    async function fetchGlobalEvents() {
        const url = "https://raw.githubusercontent.com/SaberAltered/MHS_SCHEDULE/main/events.json?v=" + Date.now();
        try {
            const response = await fetch(url);
            if (!response.ok) return;
            const globalEvents = await response.json();

            const localIds = new Set(personalEvents.map(e => e.id));
            globalEvents.forEach(ge => {
                if (!localIds.has(ge.id)) personalEvents.push(ge);
            });
            renderEvents();
        } catch (e) { console.log("Remote load failed."); }
    }

    function addPersonalEvent() {
        const nameInput = document.getElementById('event-name');
        const timeInput = document.getElementById('event-time-val');
        const name = nameInput.value.trim();
        const time = timeInput.value.trim();
        if (name && time) {
            personalEvents.push({ id: Date.now(), name, time });
            saveEvents();
            nameInput.value = '';
            timeInput.value = '';
            renderEvents();
        }
    }

    function deleteEvent(id) {
        personalEvents = personalEvents.filter(e => e.id !== id);
        saveEvents();
        renderEvents();
    }

    function renderEvents() {
        const listEl = document.getElementById('events-list');
        const cardEl = document.getElementById('events-card');
        if (personalEvents.length === 0) { cardEl.style.display = 'none'; return; }
        cardEl.style.display = 'block';
        listEl.innerHTML = personalEvents.map(e => `
            <div class="event-item">
                <div class="event-info"><span style="font-size:0.9rem;">${e.name}</span><span class="event-time">${e.time}</span></div>
                <button class="delete-btn" data-id="${e.id}" aria-label="Delete event">×</button>
            </div>`).join('');

        listEl.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', () => deleteEvent(Number(btn.dataset.id)));
        });
    }

    /* =========================================
       SECTION 8: CORE ENGINE & RENDERING
    ========================================= */
    const dayThemes = {
        "A": {
            label: "Aha Day",
            icon: "★",
            img: "art/Aha.webp",
            alt: "Aha watching over Hunter's schedule",
            confetti: ['#fbbf24', '#fde047', '#c084fc', '#f43f5e', '#f8fafc'],
            audio: "aha-giggle.mp3",
            chime: [523.25, 659.25, 783.99, 1046.5]
        },
        "B": {
            label: "Black Swan Day",
            icon: "◈",
            img: "art/BlackSwan.webp",
            alt: "Black Swan watching over Hunter's schedule",
            confetti: ['#c084fc', '#a855f7', '#38bdf8', '#f472b6', '#f8fafc'],
            audio: "blackswan-giggle.mp3",
            chime: [440.0, 554.37, 659.25, 880.0]
        }
    };

    let currentActiveType = "A";
    let testDayOverride = null;
    try {
        testDayOverride = sessionStorage.getItem('hunter-test-day');
    } catch (e) {}

    function applyTheme() {
        let img = "";
        try {
            img = localStorage.getItem('hunter-img') || "";
        } catch (e) {}

        const ahaBackdrop = document.getElementById('aha-backdrop');
        const ahaStars = document.getElementById('aha-stars');

        if (img.trim()) {
            document.documentElement.style.setProperty('--bg-image', `url('${img}')`);
            document.documentElement.style.setProperty('--overlay-display', 'block');
            ahaBackdrop.style.display = 'none';
            ahaStars.style.display = 'none';
        } else {
            document.documentElement.style.setProperty('--bg-image', 'none');
            document.documentElement.style.setProperty('--overlay-display', 'none');
            ahaBackdrop.style.display = 'block';
            ahaStars.style.display = 'block';
        }
    }

    function toggleMenu() {
        const menu = document.getElementById('settings-menu');
        menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
    }

    document.getElementById('edit-btn').addEventListener('click', toggleMenu);
    document.getElementById('close-settings-btn').addEventListener('click', toggleMenu);
    document.getElementById('add-event-btn').addEventListener('click', addPersonalEvent);

    document.getElementById('img-url').addEventListener('change', (e) => {
        try { localStorage.setItem('hunter-img', e.target.value); } catch (err) {}
        applyTheme();
    });

    document.getElementById('reset-aha-btn').addEventListener('click', () => {
        try { localStorage.removeItem('hunter-img'); } catch (err) {}
        document.getElementById('img-url').value = '';
        applyTheme();
    });

    function to12Hour(time24) {
        let [hrs, mins] = time24.split(':');
        let period = hrs >= 12 ? 'PM' : 'AM';
        hrs = hrs % 12 || 12;
        return `${hrs}:${mins} ${period}`;
    }

    function getDayType(date) {
        let count = 0;
        let cur = new Date(startDate);
        cur.setHours(0, 0, 0, 0);
        let target = new Date(date);
        target.setHours(0, 0, 0, 0);

        while (cur < target) {
            let offsetDate = new Date(cur.getTime() - (cur.getTimezoneOffset() * 60000));
            let dateStr = offsetDate.toISOString().split('T')[0];

            if (cur.getDay() !== 0 && cur.getDay() !== 6 && !holidays.includes(dateStr)) { count++; }
            cur.setDate(cur.getDate() + 1);
        }
        return (count % 2 === 0) ? startType : (startType === "A" ? "B" : "A");
    }

    function update() {
        const now = new Date();
        const dayOfWeek = now.getDay();
        const offsetDate = new Date(now.getTime() - (now.getTimezoneOffset() * 60000));
        const todayStr = offsetDate.toISOString().split('T')[0];

        const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
        const isHoliday = holidays.includes(todayStr);
        const realType = getDayType(now);
        const type = (testDayOverride === "A" || testDayOverride === "B") ? testDayOverride : realType;
        currentActiveType = type;

        const theme = dayThemes[type];
        const owImg = document.getElementById("overwatch-img");
        const backdrop = document.getElementById("aha-backdrop");
        if (backdrop) {
            backdrop.classList.toggle("theme-b", type === "B");
        }
        if (owImg && owImg.getAttribute("data-theme") !== type) {
            owImg.src = theme.img;
            owImg.alt = theme.alt;
            owImg.setAttribute("data-theme", type);
            document.querySelectorAll('.aha-star').forEach(el => {
                el.innerText = theme.icon;
                el.title = theme.label;
            });
        }

        const testBadge = document.getElementById("test-badge");
        if (testBadge) {
            testBadge.style.display = testDayOverride ? "block" : "none";
        }

        document.getElementById("clock-display").innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        document.getElementById("date-display").innerText = now.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });

        const subEl = document.getElementById("theme-subtitle");
        if (!testDayOverride && isWeekend) {
            document.getElementById("day-display").innerText = dayOfWeek === 6 ? "Saturday" : "Sunday";
            document.getElementById("body-tag").className = "";
            if (subEl) subEl.innerText = "";
        } else if (!testDayOverride && isHoliday) {
            document.getElementById("day-display").innerText = "No School";
            document.getElementById("body-tag").className = "";
            if (subEl) subEl.innerText = "";
        } else {
            document.getElementById("day-display").innerText = type + " Day";
            document.getElementById("body-tag").className = "is-" + type.toLowerCase();
            if (subEl) subEl.innerText = theme.label;
        }

        const robAlert = document.getElementById("robotics-alert");
        const robTime = document.getElementById("robotics-time");
        if (dayOfWeek === 2 || dayOfWeek === 4) {
            robAlert.style.display = "block"; robTime.innerText = "5:30-6:00 PM Meeting";
        } else if (dayOfWeek === 6) {
            robAlert.style.display = "block"; robTime.innerText = "Workshop: 7:00 AM - 3:00 PM";
        } else {
            robAlert.style.display = "none";
        }

        let html = "";
        if (!testDayOverride && (isWeekend || isHoliday)) {
            html = `<tr><td colspan='2' style='padding:30px; text-align:center; color:var(--text-dim)'>${isHoliday ? "Holiday / No Classes" : "No school today!"}</td></tr>`;
        } else {
            const list = schoolSchedule[type];
            const timeNow = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');

            let hasHighlighted = false;
            html = list.map(item => {
                const active = timeNow >= item.start && timeNow < item.end && !hasHighlighted;
                if (active) hasHighlighted = true;

                return `<tr class="${active ? 'current-row' : ''}">
                    <td class="time-col">${to12Hour(item.start)} - ${to12Hour(item.end)}</td>
                    <td>${item.name}${item.note ? `<span style="display:block; font-size:0.7rem; color:var(--text-dim); font-style:italic;">${item.note}</span>` : ''}</td>
                </tr>`;
            }).join('');
        }

        document.getElementById("schedule-body").innerHTML = html;
    }

    /* =========================================
       SECTION 9: INITIALIZATION
    ========================================= */
    applyTheme();
    renderEvents();
    fetchGlobalEvents();
    update();
    setInterval(update, 1000);

    const confettiCanvas = document.getElementById('confetti-canvas');
    const ctx = confettiCanvas.getContext('2d');
    const audioCache = {};
    let particles = [];
    let animId = null;

    function resizeConfetti() {
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeConfetti);
    resizeConfetti();

    function launchAhaConfetti(originX, originY) {
        const colors = dayThemes[currentActiveType].confetti;
        // Burst from the clicked star
        for (let i = 0; i < 70; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 4 + Math.random() * 11;
            particles.push({
                x: originX,
                y: originY,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 4,
                size: 10 + Math.random() * 13,
                color: colors[Math.floor(Math.random() * colors.length)],
                alpha: 1,
                rotation: Math.random() * 360,
                rotSpeed: (Math.random() - 0.5) * 10,
                wobble: Math.random() * Math.PI * 2,
                wobbleSpeed: 0.06 + Math.random() * 0.06,
                mode: currentActiveType,
                isAlt: Math.random() < 0.42
            });
        }
        // Screen-wide shower falling from the top
        for (let i = 0; i < 110; i++) {
            particles.push({
                x: Math.random() * confettiCanvas.width,
                y: -20 - Math.random() * (confettiCanvas.height * 0.35),
                vx: (Math.random() - 0.5) * 3,
                vy: 1.5 + Math.random() * 4,
                size: 11 + Math.random() * 14,
                color: colors[Math.floor(Math.random() * colors.length)],
                alpha: 1,
                rotation: Math.random() * 360,
                rotSpeed: (Math.random() - 0.5) * 8,
                wobble: Math.random() * Math.PI * 2,
                wobbleSpeed: 0.05 + Math.random() * 0.06,
                mode: currentActiveType,
                isAlt: Math.random() < 0.42
            });
        }
        if (!animId) animateConfetti();
    }

    function drawFourPointStar(r) {
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
            const rad = (i % 2 === 0) ? r : r * 0.36;
            const a = (i * Math.PI) / 4;
            if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
            else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
        }
        ctx.closePath();
        ctx.fill();
    }

    function drawArcanaCard(w, h, color) {
        const x = -w / 2, y = -h / 2;
        // Card base
        ctx.fillStyle = 'rgba(16, 8, 36, 0.94)';
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(x, y, w, h, 3) : ctx.rect(x, y, w, h);
        ctx.fill();
        ctx.stroke();

        // Stained-glass inner frame
        const pad = Math.max(2.5, w * 0.14);
        ctx.strokeStyle = 'rgba(253, 224, 71, 0.65)';
        ctx.lineWidth = 0.9;
        ctx.strokeRect(x + pad, y + pad, w - pad * 2, h - pad * 2);

        // Stained-glass diagonal facets
        ctx.strokeStyle = 'rgba(192, 132, 252, 0.28)';
        ctx.beginPath();
        ctx.moveTo(x + pad, y + pad);
        ctx.lineTo(x + w - pad, y + h - pad);
        ctx.moveTo(x + w - pad, y + pad);
        ctx.lineTo(x + pad, y + h - pad);
        ctx.stroke();

        // Central Arcana diamond + core
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, -h * 0.24);
        ctx.lineTo(w * 0.26, 0);
        ctx.lineTo(0, h * 0.24);
        ctx.lineTo(-w * 0.26, 0);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        ctx.arc(0, 0, Math.max(1.2, w * 0.08), 0, Math.PI * 2);
        ctx.fill();
    }

    function drawMemoryCrystal(r) {
        ctx.beginPath();
        ctx.moveTo(0, -r);
        ctx.lineTo(r * 0.62, 0);
        ctx.lineTo(0, r);
        ctx.lineTo(-r * 0.62, 0);
        ctx.closePath();
        ctx.fill();
    }

    function animateConfetti() {
        ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        particles = particles.filter(p => p.alpha > 0.02 && p.y < confettiCanvas.height + 40);

        particles.forEach(p => {
            p.wobble += p.wobbleSpeed;
            p.x += p.vx + Math.sin(p.wobble) * 1.3;
            p.y += p.vy;
            p.vy = Math.min(p.vy + 0.12, 6.2);
            p.vx *= 0.99;
            p.rotation += p.rotSpeed;
            if (p.y > confettiCanvas.height * 0.65) {
                p.alpha -= 0.018;
            } else {
                p.alpha -= 0.0025;
            }

            ctx.save();
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rotation * Math.PI / 180);
            ctx.fillStyle = p.color;
            if (p.mode === 'B') {
                drawArcanaCard(p.size * 1.15, p.size * 1.7, p.color);
            } else {
                if (p.isAlt) {
                    drawFourPointStar(p.size * 0.65);
                } else {
                    ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.55);
                }
            }
            ctx.restore();
        });

        if (particles.length > 0) {
            animId = requestAnimationFrame(animateConfetti);
        } else {
            animId = null;
        }
    }

    document.querySelectorAll('.aha-star').forEach(star => {
        star.addEventListener('click', (e) => {
            const rect = e.target.getBoundingClientRect();
            launchAhaConfetti(rect.left + rect.width / 2, rect.top + rect.height / 2);

            const activeTheme = dayThemes[currentActiveType];
            if (!audioCache[currentActiveType]) {
                audioCache[currentActiveType] = new Audio(activeTheme.audio);
            }
            const clip = audioCache[currentActiveType];
            clip.currentTime = 0;
            clip.play().catch(() => {
                try {
                    const ac = new (window.AudioContext || window.webkitAudioContext)();
                    activeTheme.chime.forEach((freq, idx) => {
                        const osc = ac.createOscillator();
                        const gain = ac.createGain();
                        osc.type = 'triangle';
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.08, ac.currentTime + idx * 0.05);
                        gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + idx * 0.05 + 0.18);
                        osc.connect(gain);
                        gain.connect(ac.destination);
                        osc.start(ac.currentTime + idx * 0.05);
                        osc.stop(ac.currentTime + idx * 0.05 + 0.2);
                    });
                } catch (err) {}
            });
        });
    });

    function setTestDay(val) {
        testDayOverride = val;
        try {
            if (val) sessionStorage.setItem('hunter-test-day', val);
            else sessionStorage.removeItem('hunter-test-day');
        } catch (e) {}
        document.getElementById('test-auto-btn').classList.toggle('active-test', !val);
        document.getElementById('test-a-btn').classList.toggle('active-test', val === 'A');
        document.getElementById('test-b-btn').classList.toggle('active-test', val === 'B');
        update();
    }

    function tryUnlockTestMode() {
        const pinInput = document.getElementById('test-pin-input');
        if (pinInput.value === '1215') {
            document.getElementById('test-lock-row').style.display = 'none';
            document.getElementById('test-controls').style.display = 'flex';
            pinInput.value = '';
        } else {
            pinInput.value = '';
            pinInput.placeholder = 'Wrong PIN';
            setTimeout(() => { pinInput.placeholder = 'Enter PIN...'; }, 1200);
        }
    }

    document.getElementById('unlock-test-btn').addEventListener('click', tryUnlockTestMode);
    document.getElementById('test-pin-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') tryUnlockTestMode();
    });
    document.getElementById('lock-test-btn').addEventListener('click', () => {
        document.getElementById('test-controls').style.display = 'none';
        document.getElementById('test-lock-row').style.display = 'flex';
    });
    document.getElementById('test-auto-btn').addEventListener('click', () => setTestDay(null));
    document.getElementById('test-a-btn').addEventListener('click', () => setTestDay('A'));
    document.getElementById('test-b-btn').addEventListener('click', () => setTestDay('B'));
    setTestDay(testDayOverride);
</script>
