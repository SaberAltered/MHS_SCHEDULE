<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunter's Social Board</title>
    <style>
        /* =========================================
           SECTION 1: THEME & COLORS
        ========================================= */
        :root {
            --bg-color: #050505;          
            --card-bg: rgba(30, 15, 45, 0.85); 
            --text-main: #f3f4f6;         
            --text-dim: #d8b4fe;          
            --accent-a: #f97316;          
            --accent-b: #a855f7;          
            --highlight: #84cc16;         
            --font-choice: 'Inter', sans-serif;
            --bg-image: none;
        }

        /* =========================================
           SECTION 2: CORE LAYOUT & TYPOGRAPHY
        ========================================= */
        body {
            font-family: var(--font-choice);
            background-color: var(--bg-color);
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0; display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 20px; box-sizing: border-box;
        }

        .header { text-align: center; margin-bottom: 20px; z-index: 1; }
        .header h1 { font-size: 2.2rem; color: var(--accent-b); margin: 0; font-weight: 900; text-transform: uppercase; text-shadow: 0 0 20px rgba(168, 85, 247, 0.5); }

        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 20px; flex-grow: 1; z-index: 1; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 20px; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.05); }
        
        .section-title { font-size: 0.8rem; text-transform: uppercase; color: var(--highlight); margin-bottom: 15px; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }

        /* =========================================
           SECTION 3: UPDATES & POSTS STYLING
        ========================================= */
        .update-post { margin-bottom: 15px; }
        .update-date { font-size: 0.7rem; color: var(--text-dim); display: block; margin-bottom: 3px; }
        .update-text { font-size: 0.9rem; line-height: 1.4; color: var(--text-main); }

        /* =========================================
           SECTION 4: BUTTONS & LINKS STYLING
        ========================================= */
        .link-grid { display: flex; flex-direction: column; gap: 10px; }
        .social-btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; transition: 0.2s; border: 1px solid transparent; }
        
        .btn-spotify { background: #1db954; color: #000; }
        .btn-spotify:hover { background: #1ed760; border-color: var(--text-main); }

        .btn-twitch { background: #6441a5; color: white; }
        .btn-twitch:hover { background: #4a2a82; border-color: var(--text-main); }
        
        .btn-youtube { background: #ff0000; color: white; }
        .btn-youtube:hover { background: #cc0000; border-color: var(--text-main); }

        .nav-btn { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #1e1b4b; color: var(--text-main); text-decoration: none; border-radius: 8px; border: 1px solid var(--text-dim); font-size: 0.85rem; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .nav-btn:hover { border-color: var(--accent-a); color: var(--accent-a); }
    </style>
</head>
<body>

    <!-- =========================================
         SECTION 5: HEADER
    ========================================= -->
    <div class="header">
        <h1>Astral Archive</h1>
    </div>

    <div class="container">
        
        <!-- =========================================
             SECTION 6: PERSONAL UPDATES
        ========================================= -->
        <div class="card">
            <div class="section-title">Updates</div>
            
            <!-- TEMPLATE: To add a new update, copy the block below and paste it ABOVE your older updates -->
            <div class="update-post">
                <span class="update-date">October 26, 2026</span>
                <div class="update-text">Working on updating this website and adding more!.</div>
            </div>
            
        </div>

        <!-- =========================================
             SECTION 7: SPOTIFY PLAYLIST
        ========================================= -->
        <div class="card">
            <div class="section-title">Current Rotation</div>
            <!-- Your specific playlist is embedded here -->
            <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/3R7Lj3FlNjyL0XrG0oCwIC?utm_source=generator&theme=0" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>

        <!-- =========================================
             SECTION 8: NETWORK LINKS
        ========================================= -->
        <div class="card">
            <div class="section-title">Network Links</div>
            <div class="link-grid">
                <a href="https://open.spotify.com/user/31hrpfxtu6o5ne44trh6u5y5fxxu" target="_blank" class="social-btn btn-spotify">🎵 Follow Profile on Spotify</a>
                <a href="https://www.twitch.tv/sparxiconofficial" target="_blank" class="social-btn btn-twitch">🎮 Follow on Twitch</a>
                <a href="https://www.youtube.com/@V11P3R" target="_blank" class="social-btn btn-youtube">📺 Subscribe on YouTube</a>
            </div>
        </div>

        <!-- =========================================
             SECTION 9: NAVIGATION
        ========================================= -->
        <a href="index.html" class="nav-btn">🔙 Return to Main Schedule</a>

    </div>

</body>
</html>
