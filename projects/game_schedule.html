<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hunters Game Schedule</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
        },
      },
    };
  </script>
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: #0b0f17;
      color: #e2e8f0;
      transition: background-color 0.3s ease;
    }
    .site-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background-color: #0b0f17;
    }
    .site-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 45% 18%;
      opacity: 0.92;
    }
    .site-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      transition: background 0.4s ease;
      background:
        linear-gradient(
          to bottom,
          rgba(7, 10, 18, 0.30) 0%,
          rgba(7, 10, 18, 0.48) 45%,
          rgba(7, 10, 18, 0.78) 100%
        ),
        radial-gradient(circle at 45% 25%, transparent 25%, rgba(7, 10, 18, 0.60) 100%);
    }
    @media (max-width: 640px) {
      .site-bg img {
        object-position: 38% 15%;
      }
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #111827;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* =========================================
       WEAKNESS IMPLANT EASTER EGG CSS
       ========================================= */
    body.weakness-implanted .site-bg::after {
      background:
        linear-gradient(
          to bottom,
          rgba(46, 16, 101, 0.45) 0%,   
          rgba(192, 38, 211, 0.30) 45%, 
          rgba(7, 10, 18, 0.85) 100%
        ),
        radial-gradient(circle at 45% 25%, transparent 25%, rgba(46, 16, 101, 0.70) 100%);
    }
    
    .weakness-scanlines {
      position: fixed;
      inset: 0;
      z-index: 40;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0),
        rgba(255, 255, 255, 0) 50%,
        rgba(192, 38, 211, 0.08) 50%,
        rgba(192, 38, 211, 0.08)
      );
      background-size: 100% 4px;
      display: none;
      mix-blend-mode: screen;
    }
    body.weakness-implanted .weakness-scanlines {
      display: block;
    }
    
    body.weakness-implanted #pageTitleHeading {
      color: #f5d0fe !important; 
      text-shadow: 2px 0 0px #06b6d4, -2px 0 0px #c026d3;
      letter-spacing: 0.5px;
    }
    
    body.weakness-implanted .bg-cyan-500 { background-color: #c026d3 !important; }
    body.weakness-implanted .hover\:bg-cyan-400:hover { background-color: #d946ef !important; }
    body.weakness-implanted .border-cyan-500\/70 { border-color: rgba(192, 38, 211, 0.7) !important; }
    body.weakness-implanted .shadow-cyan-500\/10 { box-shadow: 0 10px 15px -3px rgba(192, 38, 211, 0.1), 0 4px 6px -4px rgba(192, 38, 211, 0.1) !important; }
    body.weakness-implanted .shadow-cyan-500\/20 { box-shadow: 0 10px 15px -3px rgba(192, 38, 211, 0.2), 0 4px 6px -4px rgba(192, 38, 211, 0.1) !important; }
    body.weakness-implanted .text-cyan-300 { color: #f0abfc !important; }

    body.weakness-implanted #weaknessToggle {
      opacity: 1 !important;
      filter: drop-shadow(0 0 6px rgba(192, 38, 211, 0.9));
    }

    /* =========================================
       AETHER EDITING (GODMODE) CSS
       ========================================= */
    body.aether-editing {
      cursor: crosshair !important;
    }
    body.aether-editing * {
      cursor: crosshair !important;
    }
    body.aether-editing *:hover {
      outline: 2px dashed #c026d3 !important;
      outline-offset: -2px;
      box-shadow: inset 0 0 15px rgba(192, 38, 211, 0.4);
    }
    
    .aether-glitch-out {
      animation: targetImplode 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      pointer-events: none !important;
      transform-origin: center;
    }
    @keyframes targetImplode {
      0% { transform: scale(1); filter: brightness(1) contrast(1); opacity: 1; }
      40% { transform: scale(1.1); filter: brightness(2) contrast(2); opacity: 1; }
      100% { transform: scale(0); filter: brightness(5); opacity: 0; }
    }

    .godmode-core {
      position: fixed;
      border-radius: 50%;
      background: radial-gradient(circle, #fef08a 0%, #fbbf24 30%, #ea580c 60%, transparent 100%);
      box-shadow: 0 0 40px #ea580c, inset 0 0 20px #fef08a;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%) scale(0);
    }
    .godmode-shard {
      position: fixed;
      background: linear-gradient(180deg, #67e8f9 0%, #06b6d4 100%);
      box-shadow: 0 0 15px #22d3ee;
      pointer-events: none;
      z-index: 9998;
      clip-path: polygon(50% 0%, 100% 20%, 80% 100%, 50% 90%, 20% 100%, 0% 20%);
    }
    .godmode-pixel {
      position: fixed;
      width: 8px;
      height: 8px;
      background: #f97316;
      box-shadow: 0 0 10px #ea580c;
      pointer-events: none;
      z-index: 9999;
    }

    .sw-text-glitch {
      text-shadow: 3px 0px #06b6d4, -3px 0px #c026d3;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-fuchsia-500/30 selection:text-fuchsia-200">
  <div id="siteBg" class="site-bg"><img id="siteBgImg" src="../art/GameBg.webp" alt="" onerror="this.style.display='none'" /></div>
  <canvas id="coinRainCanvas" class="fixed inset-0 pointer-events-none z-50"></canvas>
  <div class="weakness-scanlines"></div> 

  <!-- Top Navigation / Header -->
  <header class="sticky top-0 z-30 border-b border-slate-800/70 bg-[#0b0f17]/75 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <img id="headerIconImg" src="../art/SilverWolf.webp" alt="Silver Wolf coin" title="Click me!" class="w-10 h-10 rounded-full object-cover shrink-0 cursor-pointer transition-transform hover:scale-110 active:scale-95" onerror="this.style.display='none'" />
        <div class="min-w-0 flex items-center gap-2">
          <h1 id="pageTitleHeading" class="text-base sm:text-lg font-bold tracking-tight text-white truncate transition-all">Hunters Game Schedule</h1>
          <!-- Weakness Implant Trigger -->
          <img id="weaknessToggle" src="../art/quantum.webp" alt="Quantum Weakness" class="w-4 h-4 opacity-30 hover:opacity-100 hover:scale-110 hover:drop-shadow-[0_0_5px_rgba(192,38,211,0.8)] cursor-pointer select-none transition-all" title="Target locked..." onerror="this.style.display='none'" />
        </div>
      </div>

      <!-- Primary Actions -->
      <div class="flex items-center gap-2 flex-wrap">
        <button id="settingsBtn" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs sm:text-sm font-medium text-slate-200 transition-colors" title="Settings (Games, GitHub Sync, Backup)">
          <svg class="w-4 h-4 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <span id="syncStatusDot" class="w-2 h-2 rounded-full bg-slate-500"></span>
          <span class="hidden sm:inline">Settings</span>
        </button>

        <button id="openAddSessionBtn" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs sm:text-sm font-semibold shadow-md shadow-cyan-500/20 transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
          </svg>
          <span>Plan Session</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="relative z-10 flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-5 space-y-5">
    <section class="flex flex-col md:flex-row md:items-center justify-between gap-3 bg-slate-950/65 backdrop-blur-md border border-slate-800/80 rounded-2xl p-3.5">
      <div class="flex items-center gap-2 flex-wrap">
        <div class="inline-flex rounded-lg bg-slate-950 p-1 border border-slate-800">
          <button id="prevWeekBtn" class="p-1.5 rounded-md text-slate-400 hover:text-white hover:bg-slate-800 transition-colors" aria-label="Previous week">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
          </button>
          <button id="todayBtn" class="px-2.5 py-1 rounded-md text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition-colors">
            This Week
          </button>
          <button id="nextWeekBtn" class="p-1.5 rounded-md text-slate-400 hover:text-white hover:bg-slate-800 transition-colors" aria-label="Next week">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
          </button>
        </div>
        <h2 id="weekRangeLabel" class="text-sm sm:text-base font-semibold text-white ml-1"></h2>
        <button id="fillWeekBtn" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-[11px] font-medium text-cyan-300 transition-colors" title="Fill this week with your default Sunday–Friday lineup">
          + Fill Default Week
        </button>
      </div>

      <div class="flex items-center justify-between md:justify-end gap-3 flex-wrap">
        <div id="weekStats" class="flex items-center gap-3 text-xs text-slate-400"></div>
        <div class="flex items-center gap-2">
          <div class="inline-flex rounded-lg bg-slate-950 p-1 border border-slate-800">
            <button id="viewWeekBtn" class="px-2.5 py-1 rounded-md text-xs font-medium transition-colors">Week</button>
            <button id="viewListBtn" class="px-2.5 py-1 rounded-md text-xs font-medium transition-colors">Agenda</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Game Filter Pills -->
    <section class="flex items-center gap-2 overflow-x-auto pb-1" id="gameFilterBar"></section>

    <!-- Calendar / Agenda Container -->
    <section id="scheduleContainer"></section>
  </main>

  <!-- Modals (Session, Games, Settings, Github) -->
  <div id="sessionModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 backdrop-blur-sm p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between">
        <h3 id="sessionModalTitle" class="text-base font-semibold text-white">Plan Game Session</h3>
        <button id="closeSessionModalBtn" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition-colors">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
      </div>
      <form id="sessionForm" class="p-5 space-y-4">
        <input type="hidden" id="sessionIdInput" />
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Game</label>
          <select id="sessionGameSelect" required class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500"></select>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1.5">Date</label>
            <input type="date" id="sessionDateInput" required class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1.5">Status</label>
            <select id="sessionStatusSelect" class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500">
              <option value="planned">Planned</option>
              <option value="confirmed">Confirmed</option>
              <option value="done">Done</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1.5">Start Time</label>
            <input type="time" id="sessionStartInput" required class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1.5">End Time</label>
            <input type="time" id="sessionEndInput" required class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Notes / Goal (optional)</label>
          <input type="text" id="sessionNotesInput" placeholder="e.g., Island raids, weekly boss..." class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500" />
        </div>
        <label class="flex items-center gap-2.5 cursor-pointer select-none">
          <input type="checkbox" id="sessionRepeatInput" class="w-4 h-4 rounded border-slate-600 bg-slate-950 text-cyan-500 focus:ring-cyan-500" />
          <span class="text-xs text-slate-300">Repeat every week on this day</span>
        </label>
        <div class="pt-2 flex items-center justify-between gap-3">
          <button type="button" id="deleteSessionBtn" class="hidden px-3.5 py-2.5 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 text-rose-400 text-sm font-medium transition-colors">Delete</button>
          <div class="flex items-center gap-2 ml-auto">
            <button type="button" id="cancelSessionBtn" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium transition-colors">Cancel</button>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-sm font-semibold transition-colors">Save Session</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div id="gamesModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 backdrop-blur-sm p-4">
    <div class="w-full max-w-lg bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
      <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between">
        <h3 class="text-base font-semibold text-white">Your Game Roster</h3>
        <button id="closeGamesModalBtn" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition-colors"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg></button>
      </div>
      <div class="p-5 space-y-4 overflow-y-auto">
        <form id="addGameForm" class="bg-slate-950/70 border border-slate-800 rounded-xl p-3.5 space-y-3">
          <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">Add a Game</div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            <input type="text" id="newGameNameInput" required placeholder="Game title" class="rounded-lg bg-slate-900 border border-slate-700 px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500" />
            <input type="text" id="newGamePlatformInput" placeholder="Platform" class="rounded-lg bg-slate-900 border border-slate-700 px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500" />
          </div>
          <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-2" id="colorPickerRow"></div>
            <button type="submit" class="px-4 py-2 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs font-semibold transition-colors">Add Game</button>
          </div>
        </form>
        <div id="gamesListContainer" class="space-y-2"></div>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 backdrop-blur-sm p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between">
        <h3 class="text-base font-semibold text-white">Settings</h3>
        <button id="closeSettingsModalBtn" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition-colors"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg></button>
      </div>
      <div class="p-5 space-y-4">
        <div class="space-y-2">
          <button id="manageGamesBtn" class="w-full flex items-center justify-between px-4 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sm font-medium text-white transition-colors">
            <span class="inline-flex items-center gap-2.5"><span class="text-amber-400">🎮</span><span>Games Roster</span></span><span class="text-xs text-slate-400">Add / Remove</span>
          </button>
          <button id="githubSyncBtn" class="w-full flex items-center justify-between px-4 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sm font-medium text-white transition-colors">
            <span class="inline-flex items-center gap-2.5"><span id="syncModalDot" class="w-2.5 h-2.5 rounded-full bg-slate-500"></span><span>GitHub Sync (games.json)</span></span><span id="syncStatusText" class="text-xs text-slate-400">Configure</span>
          </button>
        </div>
        <div class="pt-3 border-t border-slate-800 space-y-2.5">
          <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">Export / Import</div>
          <div class="grid grid-cols-2 gap-2.5">
            <button id="exportJsonBtn" class="px-3.5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sm font-medium text-white transition-colors">Export JSON</button>
            <label class="px-3.5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sm font-medium text-white text-center cursor-pointer transition-colors">
              Import JSON <input type="file" id="importJsonInput" accept="application/json,.json" class="hidden" />
            </label>
          </div>
        </div>
        <div class="pt-3 border-t border-slate-800 flex items-center justify-between">
          <span class="text-xs text-slate-400">Restore default schedule?</span>
          <button id="confirmResetBtn" class="px-3 py-1.5 rounded-lg bg-rose-500/15 hover:bg-rose-500/25 text-rose-400 text-xs font-medium transition-colors">Reset Data</button>
        </div>
      </div>
    </div>
  </div>

  <div id="githubModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 backdrop-blur-sm p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
      <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between">
        <h3 class="text-base font-semibold text-white">GitHub Auto-Sync</h3>
        <button id="closeGithubModalBtn" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition-colors"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg></button>
      </div>
      <form id="githubForm" class="p-5 space-y-3.5 overflow-y-auto">
        <div class="rounded-xl bg-slate-950/80 border border-slate-800 px-3.5 py-2.5 flex items-center justify-between gap-2">
          <span class="text-xs text-slate-300">Vault Status:</span> <span id="ghVaultBadge" class="text-xs font-semibold text-slate-400">No token saved</span>
        </div>
        <div class="grid grid-cols-2 gap-2.5">
          <div><label class="block text-xs font-medium text-slate-300 mb-1">GitHub Owner</label><input type="text" id="ghOwnerInput" required class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm text-white" /></div>
          <div><label class="block text-xs font-medium text-slate-300 mb-1">Repository</label><input type="text" id="ghRepoInput" required class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm text-white" /></div>
        </div>

            <button type="button" id="ghForgetBtn" class="hidden px-2.5 py-2 rounded-xl bg-rose-500/15 text-xs font-medium text-rose-300">Forget</button>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 z-[200] hidden items-center gap-2 px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white shadow-xl transition-all">

  <!-- Reboot Reality Button (Aether Editing Only) -->

    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
    Reboot Reality
  </button>

  <!-- Level 999 Activation Splash Screen -->
  <div id="punklordeSplash" class="fixed inset-0 z-[9999] hidden items-center justify-center bg-slate-950/80 backdrop-blur-sm transition-all duration-300 opacity-0 pointer-events-none">
    <div class="relative border border-fuchsia-500/50 bg-slate-900/90 p-8 rounded-xl shadow-[0_0_30px_rgba(192,38,211,0.3)] text-center overflow-hidden w-[90%] max-w-lg">
      <div class="absolute inset-0 pointer-events-none bg-[linear-gradient(transparent_50%,rgba(192,38,211,0.1)_50%)] bg-[length:100%_4px]"></div>
      <h2 class="relative z-10 text-fuchsia-400 font-mono text-2xl sm:text-4xl font-bold tracking-widest uppercase mb-3 sw-text-glitch animate-pulse">
        Account #76 Active
      </h2>
      <p class="relative z-10 text-cyan-400 font-mono text-xs sm:text-sm tracking-widest">
        [ LEVEL 999 CARTRIDGE LOADED ]
      </p>
    </div>
  </div>

  <script>
    const SCHEDULE_CONFIG = {
      title: 'Hunters Game Schedule',
      iconPath: '../art/SilverWolf.webp',
      backgroundPath: '../art/GameBg.webp',
      audioPath: '../audio/silverwolf.ogg',
      github: { owner: 'SaberAltered', repo: 'MHS_SCHEDULE', branch: 'main', path: 'games.json' },
      games: [
        { id: 'g-lone-echo', name: 'Lone Echo', platform: 'PCVR', color: 'cyan' },
        { id: 'g-tabor', name: 'Ghosts of Tabor', platform: 'PCVR / Quest', color: 'amber' },
        { id: 'g-007', name: '007 First Light', platform: 'PC', color: 'indigo' },
        { id: 'g-hsr', name: 'Honkai: Star Rail', platform: 'PC', color: 'violet' },
      ],
      weeklyTemplate: [
        { id: 's-sun', dayOffset: 0, gameId: 'g-lone-echo', startTime: '19:30', endTime: '21:30', notes: '', status: 'planned', repeatWeekly: true },
        { id: 's-mon', dayOffset: 1, gameId: 'g-lone-echo', startTime: '19:30', endTime: '21:30', notes: '', status: 'planned', repeatWeekly: true },
        { id: 's-tue', dayOffset: 2, gameId: 'g-tabor', startTime: '19:30', endTime: '21:30', notes: '', status: 'planned', repeatWeekly: true },
        { id: 's-wed', dayOffset: 3, gameId: 'g-tabor', startTime: '19:30', endTime: '21:30', notes: '', status: 'planned', repeatWeekly: true },
        { id: 's-thu', dayOffset: 4, gameId: 'g-007', startTime: '19:30', endTime: '21:30', notes: '', status: 'planned', repeatWeekly: true },
        { id: 's-fri', dayOffset: 5, gameId: 'g-hsr', startTime: '19:30', endTime: '21:30', notes: '', status: 'planned', repeatWeekly: true },
      ],
    };

    (function () {
      const STORAGE_KEY = 'hunters_game_schedule_v1';
      const GH_CONFIG_KEY = 'hunters_gh_sync_config_v1';

      const PALETTE = [
        { id: 'cyan', bg: 'bg-cyan-500/15', border: 'border-cyan-500/40', text: 'text-cyan-300', dot: 'bg-cyan-400', swatch: '#06b6d4' },
        { id: 'indigo', bg: 'bg-indigo-500/15', border: 'border-indigo-500/40', text: 'text-indigo-300', dot: 'bg-indigo-400', swatch: '#6366f1' },
        { id: 'amber', bg: 'bg-amber-500/15', border: 'border-amber-500/40', text: 'text-amber-300', dot: 'bg-amber-400', swatch: '#f59e0b' },
        { id: 'emerald', bg: 'bg-emerald-500/15', border: 'border-emerald-500/40', text: 'text-emerald-300', dot: 'bg-emerald-400', swatch: '#10b981' },
        { id: 'rose', bg: 'bg-rose-500/15', border: 'border-rose-500/40', text: 'text-rose-300', dot: 'bg-rose-400', swatch: '#f43f5e' },
        { id: 'violet', bg: 'bg-violet-500/15', border: 'border-violet-500/40', text: 'text-violet-300', dot: 'bg-violet-400', swatch: '#8b5cf6' },
      ];

      function toISODate(d) { const y = d.getFullYear(); const m = String(d.getMonth() + 1).padStart(2, '0'); const day = String(d.getDate()).padStart(2, '0'); return `${y}-${m}-${day}`; }
      function getSundayOfWeek(dateObj) { const d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate()); d.setDate(d.getDate() - d.getDay()); return d; }
      function addDays(dateObj, days) { const d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate()); d.setDate(d.getDate() + days); return d; }
      function getDayOfWeekFromISO(iso) { return new Date(iso + 'T00:00:00').getDay(); }
      function getSessionsForDate(iso, list) {
        const dow = getDayOfWeekFromISO(iso);
        return (list || state.sessions).filter((sess) => sess.repeatWeekly ? getDayOfWeekFromISO(sess.date) === dow : sess.date === iso);
      }

      function buildDefaultState() {
        const today = new Date(); const sunday = getSundayOfWeek(today);
        return {
          games: SCHEDULE_CONFIG.games.map((g) => ({ ...g })),
          sessions: SCHEDULE_CONFIG.weeklyTemplate.map((item) => ({
            id: item.id, date: toISODate(addDays(sunday, item.dayOffset)), gameId: item.gameId, startTime: item.startTime, endTime: item.endTime, notes: item.notes || '', status: item.status || 'planned', repeatWeekly: item.repeatWeekly !== false,
          })),
        };
      }

      let state = loadState();
      let currentWeekStart = getSundayOfWeek(new Date());
      let viewMode = 'week'; 
      let selectedGameFilter = 'all';
      let selectedSwatchColor = PALETTE[0].id;
      let resetArmed = false;

      function loadState() {
        try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) { const parsed = JSON.parse(raw); if (parsed && Array.isArray(parsed.games) && Array.isArray(parsed.sessions)) { return { games: parsed.games, sessions: parsed.sessions }; } } } catch (e) {}
        return buildDefaultState();
      }

      let ghConfig = loadGhConfig();
      let sessionToken = ''; 
      let ghSyncing = false;

      function loadGhConfig() {
        const defaults = { owner: SCHEDULE_CONFIG.github.owner, repo: SCHEDULE_CONFIG.github.repo, branch: SCHEDULE_CONFIG.github.branch, path: SCHEDULE_CONFIG.github.path, encryptedToken: null, autoPush: true };
        try { const raw = localStorage.getItem(GH_CONFIG_KEY); if (raw) { const parsed = JSON.parse(raw); delete parsed.token; return { ...defaults, ...parsed }; } } catch (e) {}
        return defaults;
      }

      function saveGhConfig() { try { localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(ghConfig)); } catch (e) {} }
      function bytesToB64(bytes) { let bin = ''; for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]); return btoa(bin); }
      function b64ToBytes(b64) { const bin = atob(b64); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return bytes; }
      async function deriveAesKey(passphrase, saltBytes) { const enc = new TextEncoder(); const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']); return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: saltBytes, iterations: 100000, hash: 'SHA-256' }, keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']); }
      async function encryptToken(token, passphrase) { const salt = crypto.getRandomValues(new Uint8Array(16)); const iv = crypto.getRandomValues(new Uint8Array(12)); const key = await deriveAesKey(passphrase, salt); const ctBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(token)); return { ct: bytesToB64(new Uint8Array(ctBuf)), iv: bytesToB64(iv), salt: bytesToB64(salt) }; }
      async function decryptToken(encryptedObj, passphrase) { const salt = b64ToBytes(encryptedObj.salt); const iv = b64ToBytes(encryptedObj.iv); const ct = b64ToBytes(encryptedObj.ct); const key = await deriveAesKey(passphrase, salt); const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct); return new TextDecoder().decode(plainBuf); }

      function setSyncIndicator(status, label) {
        const dot = document.getElementById('syncStatusDot'); const modalDot = document.getElementById('syncModalDot'); const txt = document.getElementById('syncStatusText');
        const map = { idle: 'bg-slate-500', syncing: 'bg-amber-400 animate-pulse', synced: 'bg-emerald-400', error: 'bg-rose-400' };
        const cls = map[status] || map.idle;
        if (dot) dot.className = 'w-2 h-2 rounded-full ' + cls; if (modalDot) modalDot.className = 'w-2.5 h-2.5 rounded-full ' + cls; if (txt) txt.textContent = label || 'Configure';
      }
      function utf8ToBase64(str) { const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]); return btoa(bin); }

      async function pullFromGitHub(silent) {
        const apiUrl = `https://api.github.com/repos/${encodeURIComponent(ghConfig.owner)}/${encodeURIComponent(ghConfig.repo)}/contents/${ghConfig.path}?ref=${encodeURIComponent(ghConfig.branch)}`;
        const rawUrl = `https://raw.githubusercontent.com/${encodeURIComponent(ghConfig.owner)}/${encodeURIComponent(ghConfig.repo)}/${encodeURIComponent(ghConfig.branch)}/${ghConfig.path}?t=${Date.now()}`;
        try {
          setSyncIndicator('syncing', 'Syncing...');
          const res = sessionToken ? await fetch(apiUrl, { cache: 'no-store', headers: { Authorization: `Bearer ${sessionToken}`, Accept: 'application/vnd.github.raw+json' } }) : await fetch(rawUrl, { cache: 'no-store' });
          if (!res.ok) { setSyncIndicator('idle', sessionToken ? 'Unlocked' : (ghConfig.encryptedToken ? 'Locked' : 'Configure')); if (!silent) showToast(`No ${ghConfig.path} found yet (HTTP ${res.status})`); return false; }
          const parsed = await res.json();
          if (parsed && Array.isArray(parsed.games) && Array.isArray(parsed.sessions)) { state = { games: parsed.games, sessions: parsed.sessions }; try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} renderAll(); setSyncIndicator('synced', 'Synced'); if (!silent) showToast('Pulled latest games.json'); return true; }
        } catch (e) { setSyncIndicator('error', 'Sync Error'); if (!silent) showToast('Could not fetch from GitHub'); }
        return false;
      }

      async function fetchRemoteSha(apiUrl, getHeaders) {
        const getRes = await fetch(`${apiUrl}?ref=${encodeURIComponent(ghConfig.branch)}`, { cache: 'no-store', headers: getHeaders });
        if (getRes.ok) { const meta = await getRes.json(); return meta.sha; }
        if (getRes.status === 404) return undefined;
        const errBody = await getRes.json().catch(() => ({})); throw new Error(errBody.message || `GitHub lookup failed (${getRes.status})`);
      }

      async function pushToGitHub(silent) {
        if (!sessionToken) { if (!silent) showToast(ghConfig.encryptedToken ? 'Unlock GitHub Sync with your passphrase first.' : 'Add & encrypt your GitHub token first.'); return false; }
        if (ghSyncing) return false;
        ghSyncing = true; setSyncIndicator('syncing', 'Pushing...');
        const apiUrl = `https://api.github.com/repos/${encodeURIComponent(ghConfig.owner)}/${encodeURIComponent(ghConfig.repo)}/contents/${ghConfig.path}`;
        const getHeaders = { Authorization: `Bearer ${sessionToken}`, Accept: 'application/vnd.github+json' };
        const putHeaders = { ...getHeaders, 'Content-Type': 'application/json' };
        try {
          let sha = await fetchRemoteSha(apiUrl, getHeaders);
          const encodedContent = utf8ToBase64(JSON.stringify(state, null, 2) + '\n');
          const buildPayload = (currentSha) => { const p = { message: `Update ${ghConfig.path} via Hunters Game Schedule`, content: encodedContent, branch: ghConfig.branch }; if (currentSha) p.sha = currentSha; return p; };
          let putRes = await fetch(apiUrl, { method: 'PUT', headers: putHeaders, body: JSON.stringify(buildPayload(sha)) });
          if (putRes.status === 409) { sha = await fetchRemoteSha(apiUrl, getHeaders); putRes = await fetch(apiUrl, { method: 'PUT', headers: putHeaders, body: JSON.stringify(buildPayload(sha)) }); }
          if (!putRes.ok) { const errBody = await putRes.json().catch(() => ({})); throw new Error(errBody.message || `HTTP ${putRes.status}`); }
          const result = await putRes.json().catch(() => ({})); const shortSha = result.commit && result.commit.sha ? result.commit.sha.slice(0, 7) : '';
          setSyncIndicator('synced', 'Synced');
          const infoEl = document.getElementById('ghLastSyncInfo'); if (infoEl) infoEl.textContent = `Last pushed: ${new Date().toLocaleTimeString()}${shortSha ? ' (' + shortSha + ')' : ''}`;
          showToast(shortSha ? `Pushed games.json (${shortSha})` : 'Pushed games.json to GitHub!'); return true;
        } catch (err) { setSyncIndicator('error', 'Push Failed'); showToast('GitHub push failed: ' + err.message); return false; } finally { ghSyncing = false; }
      }

      function saveState(skipAutoPush) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} if (!skipAutoPush && sessionToken && ghConfig.autoPush) { pushToGitHub(true); } }
      function getPalette(colorId) { return PALETTE.find((p) => p.id === colorId) || PALETTE[0]; }
      function getGameById(id) { return state.games.find((g) => g.id === id) || { id: 'unknown', name: 'Unknown Game', platform: '', color: 'cyan' }; }
      function formatTime12h(hhmm) { if (!hhmm) return ''; const [hStr, mStr] = hhmm.split(':'); let h = parseInt(hStr, 10); const ampm = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${mStr} ${ampm}`; }
      function escapeHtml(str) { return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

      let toastTimer = null;
      function showToast(msg) {
        const toast = document.getElementById('toast'); const toastMsg = document.getElementById('toastMessage');
        toastMsg.textContent = msg; toast.classList.remove('hidden'); toast.classList.add('flex');
        if (toastTimer) clearTimeout(toastTimer); toastTimer = setTimeout(() => { toast.classList.add('hidden'); toast.classList.remove('flex'); }, 2600);
      }

      function statusBadge(status) {
        if (status === 'confirmed') return '<span class="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">Confirmed</span>';
        if (status === 'done') return '<span class="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-slate-700/60 text-slate-300 border border-slate-600/50">Done</span>';
        return '<span class="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-amber-500/15 text-amber-300 border border-amber-500/30">Planned</span>';
      }

      function renderAll() { renderWeekHeader(); renderFilterBar(); renderViewToggle(); renderSchedule(); }

      function renderWeekHeader() {
        const end = addDays(currentWeekStart, 6); const opts = { month: 'short', day: 'numeric' };
        document.getElementById('weekRangeLabel').textContent = `${currentWeekStart.toLocaleDateString('en-US', opts)} – ${end.toLocaleDateString('en-US', { ...opts, year: 'numeric' })}`;
        const weekSessions = [];
        for (let i = 0; i < 7; i++) { weekSessions.push(...getSessionsForDate(toISODate(addDays(currentWeekStart, i)))); }
        const confirmed = weekSessions.filter((s) => s.status === 'confirmed').length; const done = weekSessions.filter((s) => s.status === 'done').length;
        document.getElementById('weekStats').innerHTML = `<span><strong class="text-white">${weekSessions.length}</strong> planned</span><span class="text-slate-600">•</span><span><strong class="text-emerald-400">${confirmed}</strong> confirmed</span><span class="text-slate-600 hidden sm:inline">•</span><span class="hidden sm:inline"><strong class="text-slate-300">${done}</strong> done</span>`;
      }

      function renderViewToggle() {
        const weekBtn = document.getElementById('viewWeekBtn'); const listBtn = document.getElementById('viewListBtn');
        if (viewMode === 'week') { weekBtn.className = 'px-2.5 py-1 rounded-md text-xs font-medium bg-cyan-500 text-slate-950 transition-colors'; listBtn.className = 'px-2.5 py-1 rounded-md text-xs font-medium text-slate-400 hover:text-white transition-colors'; } else { listBtn.className = 'px-2.5 py-1 rounded-md text-xs font-medium bg-cyan-500 text-slate-950 transition-colors'; weekBtn.className = 'px-2.5 py-1 rounded-md text-xs font-medium text-slate-400 hover:text-white transition-colors'; }
      }

      function renderFilterBar() {
        const bar = document.getElementById('gameFilterBar'); const allActive = selectedGameFilter === 'all';
        let html = `<button data-filter="all" class="shrink-0 px-3 py-1.5 rounded-full text-xs font-medium border transition-colors ${allActive ? 'bg-cyan-500/20 border-cyan-500/50 text-cyan-300' : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-white hover:border-slate-700'}">All Games</button>`;
        for (const g of state.games) {
          const p = getPalette(g.color); const active = selectedGameFilter === g.id;
          html += `<button data-filter="${escapeHtml(g.id)}" class="shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium border transition-colors ${active ? `${p.bg} ${p.border} ${p.text}` : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-white hover:border-slate-700'}"><span class="w-2 h-2 rounded-full ${p.dot}"></span><span>${escapeHtml(g.name)}</span></button>`;
        }
        bar.innerHTML = html;
      }

      function renderSchedule() {
        const container = document.getElementById('scheduleContainer'); const todayISO = toISODate(new Date());
        const filteredSessions = state.sessions.filter((s) => selectedGameFilter === 'all' || s.gameId === selectedGameFilter).slice().sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));
        if (viewMode === 'week') {
          let gridHtml = '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-7 gap-3">';
          for (let i = 0; i < 7; i++) {
            const d = addDays(currentWeekStart, i); const iso = toISODate(d); const isToday = iso === todayISO;
            const dayName = d.toLocaleDateString('en-US', { weekday: 'short' }); const dayNum = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            const daySessions = getSessionsForDate(iso, filteredSessions);
            gridHtml += `<div class="flex flex-col rounded-2xl border ${isToday ? 'border-cyan-500/70 bg-slate-950/75 backdrop-blur-md shadow-lg shadow-cyan-500/10' : 'border-slate-800/80 bg-slate-950/60 backdrop-blur-md'} min-h-[190px] overflow-hidden transition-colors"><div class="px-3 py-2.5 border-b border-slate-800/80 flex items-center justify-between ${isToday ? 'bg-cyan-500/10' : ''}"><div><div class="text-xs font-semibold ${isToday ? 'text-cyan-300' : 'text-slate-300'}">${dayName} ${isToday ? '• Today' : ''}</div><div class="text-[11px] text-slate-500">${dayNum}</div></div><button data-add-date="${iso}" class="w-6 h-6 rounded-lg bg-slate-800 hover:bg-cyan-500 hover:text-slate-950 text-slate-300 flex items-center justify-center transition-colors" title="Plan session on ${dayNum}"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg></button></div><div class="p-2.5 flex-1 space-y-2">${daySessions.length === 0 ? '<div class="h-full flex items-center justify-center text-[11px] text-slate-600 py-6">Free day</div>' : daySessions.map((s) => renderSessionCard(s)).join('')}</div></div>`;
          }
          gridHtml += '</div>'; container.innerHTML = gridHtml;
        } else {
          const weekSessions = [];
          for (let i = 0; i < 7; i++) { const iso = toISODate(addDays(currentWeekStart, i)); weekSessions.push(...getSessionsForDate(iso, filteredSessions).map((sess) => ({ ...sess, _displayDate: iso }))); }
          if (weekSessions.length === 0) {
            container.innerHTML = `<div class="rounded-2xl border border-slate-800 bg-slate-900/50 p-10 text-center space-y-3"><p class="text-sm text-slate-400">No sessions planned for this week yet.</p><button id="emptyAddBtn" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-sm font-semibold transition-colors">Plan First Session</button></div>`;
            const emptyBtn = document.getElementById('emptyAddBtn'); if (emptyBtn) emptyBtn.addEventListener('click', () => openSessionModal(null, toISODate(currentWeekStart)));

            shard.style.height = '50px';
            
            const angle = (i * 45) + (Math.random() * 20 - 10);
            document.body.appendChild(shard);
            
            shard.animate([
                { transform: `translate(-50%, -50%) rotate(${angle}deg) translateY(-20px)`, opacity: 1 },
                { transform: `translate(-50%, -50%) rotate(${angle}deg) translateY(-250px)`, opacity: 0 }
            ], { duration: 350 + Math.random()*150, easing: 'ease-out', fill: 'forwards' });
            
            setTimeout(() => shard.remove(), 550);
        }

        for(let i=0; i<15; i++) {
            const px = document.createElement('div');
            px.className = 'godmode-pixel';
            px.style.left = x + 'px';
            px.style.top = y + 'px';
            
            const angle = Math.random() * 360;
            const dist = 40 + Math.random() * 120;
            const rad = angle * Math.PI / 180;
            const dx = Math.cos(rad) * dist;
            const dy = Math.sin(rad) * dist;
            
            document.body.appendChild(px);
            
            px.animate([
                { transform: `translate(-50%, -50%) scale(1)`, opacity: 1 },
                { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0)`, opacity: 0 }
            ], { duration: 400 + Math.random()*200, easing: 'cubic-bezier(0.25, 1, 0.5, 1)', fill: 'forwards' });
            
            setTimeout(() => px.remove(), 650);
        }
        
        setTimeout(() => core.remove(), 450);
      }

      document.addEventListener('click', (e) => {
        if (!document.body.classList.contains('aether-editing')) return;
        if (e.target.closest('#rebootRealityBtn') || e.target.closest('#toast')) return;

        e.preventDefault(); e.stopPropagation();
        const target = e.target;
        
        const rect = target.getBoundingClientRect();
        const x = rect.left + rect.width / 2;
        const y = rect.top + rect.height / 2;
        
        target.classList.add('aether-glitch-out');
        triggerGodmodeExplosion(x, y);
        
        setTimeout(() => { target.remove(); }, 250); 
      }, true); 

      document.getElementById('rebootRealityBtn').addEventListener('click', () => { location.reload(); });

      renderAll(); updateVaultUI(); pullFromGitHub(true);
    })();
  </script>
</body>
</html>
